name: Daily SEO & Jobs Generator

on:
  schedule:
    # Runs everyday at midnight UTC (5:30 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate-seo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run SEO & Jobs Generation Pipeline
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run seo:generate

      - name: Commit and Push Updated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs/ public/sitemap* public/llms.txt scripts/seo-generator/jobs.json
          if git diff --staged --quiet; then
            echo "No changes in SEO pages."
          else
            git commit -m "chore(seo): automated daily refresh of job pages and sitemaps [skip ci]"
            git push
          fi
