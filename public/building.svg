<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#c3cfe2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c0d6"/>
      <stop offset="50%" stop-color="#7fa8c9"/>
      <stop offset="100%" stop-color="#5b8db8"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b8dad" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4a6f8a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#sky)"/>
  <!-- Main tower -->
  <polygon points="160,30 200,15 240,30 235,190 165,190" fill="url(#glass)" stroke="#5a8aa8" stroke-width="0.5"/>
  <!-- Left face (darker) -->
  <polygon points="160,30 165,190 130,190 140,50" fill="url(#shadow)" opacity="0.7"/>
  <!-- Right face (lighter) -->
  <polygon points="240,30 235,190 270,190 260,50" fill="#8fb8d4" opacity="0.5"/>
  <!-- Window rows -->
  <g fill="#c8dff0" fill-opacity="0.4" stroke="#5a8aa8" stroke-width="0.3">
    <rect x="170" y="40" width="60" height="8" rx="1"/>
    <rect x="170" y="55" width="60" height="8" rx="1"/>
    <rect x="170" y="70" width="60" height="8" rx="1"/>
    <rect x="170" y="85" width="60" height="8" rx="1"/>
    <rect x="170" y="100" width="60" height="8" rx="1"/>
    <rect x="170" y="115" width="60" height="8" rx="1"/>
    <rect x="170" y="130" width="60" height="8" rx="1"/>
    <rect x="170" y="145" width="60" height="8" rx="1"/>
    <rect x="170" y="160" width="60" height="8" rx="1"/>
    <rect x="170" y="175" width="60" height="8" rx="1"/>
  </g>
  <!-- Side windows left -->
  <g fill="#7a9ab5" fill-opacity="0.3" stroke="#4a7090" stroke-width="0.2">
    <rect x="143" y="55" width="17" height="7" rx="1"/>
    <rect x="143" y="70" width="17" height="7" rx="1"/>
    <rect x="143" y="85" width="17" height="7" rx="1"/>
    <rect x="143" y="100" width="17" height="7" rx="1"/>
    <rect x="143" y="115" width="17" height="7" rx="1"/>
    <rect x="143" y="130" width="17" height="7" rx="1"/>
    <rect x="143" y="145" width="17" height="7" rx="1"/>
    <rect x="143" y="160" width="17" height="7" rx="1"/>
    <rect x="143" y="175" width="17" height="7" rx="1"/>
  </g>
  <!-- Side windows right -->
  <g fill="#a8c8de" fill-opacity="0.3" stroke="#5a8aa8" stroke-width="0.2">
    <rect x="240" y="55" width="17" height="7" rx="1"/>
    <rect x="240" y="70" width="17" height="7" rx="1"/>
    <rect x="240" y="85" width="17" height="7" rx="1"/>
    <rect x="240" y="100" width="17" height="7" rx="1"/>
    <rect x="240" y="115" width="17" height="7" rx="1"/>
    <rect x="240" y="130" width="17" height="7" rx="1"/>
    <rect x="240" y="145" width="17" height="7" rx="1"/>
    <rect x="240" y="160" width="17" height="7" rx="1"/>
    <rect x="240" y="175" width="17" height="7" rx="1"/>
  </g>
  <!-- Spire -->
  <line x1="200" y1="15" x2="200" y2="2" stroke="#5a8aa8" stroke-width="1.5"/>
  <circle cx="200" cy="2" r="2" fill="#5a8aa8"/>
  <!-- Ground line -->
  <line x1="0" y1="190" x2="400" y2="190" stroke="#9bb0c4" stroke-width="0.5"/>
</svg>
