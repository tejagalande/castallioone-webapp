<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <!-- Main tower wireframe -->
  <g stroke="url(#wire)" stroke-width="0.8" fill="none" opacity="0.85">
    <!-- Tower outline -->
    <polygon points="200,20 260,60 260,280 140,280 140,60"/>
    <!-- Left face -->
    <polygon points="140,60 100,80 100,280 140,280"/>
    <!-- Right face -->
    <polygon points="260,60 300,80 300,280 260,280"/>
    <!-- Top pyramid -->
    <polygon points="200,20 230,40 200,35 170,40"/>
    <polygon points="200,20 230,40 260,60 200,50"/>
    <polygon points="200,20 170,40 140,60 200,50"/>
  </g>
  <!-- Horizontal floor lines -->
  <g stroke="#4a9eff" stroke-width="0.4" opacity="0.5">
    <line x1="140" y1="80" x2="260" y2="80"/>
    <line x1="100" y1="100" x2="140" y2="100"/>
    <line x1="260" y1="100" x2="300" y2="100"/>
    <line x1="140" y1="100" x2="260" y2="100"/>
    <line x1="100" y1="120" x2="140" y2="120"/>
    <line x1="260" y1="120" x2="300" y2="120"/>
    <line x1="140" y1="120" x2="260" y2="120"/>
    <line x1="100" y1="140" x2="140" y2="140"/>
    <line x1="260" y1="140" x2="300" y2="140"/>
    <line x1="140" y1="140" x2="260" y2="140"/>
    <line x1="100" y1="160" x2="140" y2="160"/>
    <line x1="260" y1="160" x2="300" y2="160"/>
    <line x1="140" y1="160" x2="260" y2="160"/>
    <line x1="100" y1="180" x2="140" y2="180"/>
    <line x1="260" y1="180" x2="300" y2="180"/>
    <line x1="140" y1="180" x2="260" y2="180"/>
    <line x1="100" y1="200" x2="140" y2="200"/>
    <line x1="260" y1="200" x2="300" y2="200"/>
    <line x1="140" y1="200" x2="260" y2="200"/>
    <line x1="100" y1="220" x2="140" y2="220"/>
    <line x1="260" y1="220" x2="300" y2="220"/>
    <line x1="140" y1="220" x2="260" y2="220"/>
    <line x1="100" y1="240" x2="140" y2="240"/>
    <line x1="260" y1="240" x2="300" y2="240"/>
    <line x1="140" y1="240" x2="260" y2="240"/>
    <line x1="100" y1="260" x2="140" y2="260"/>
    <line x1="260" y1="260" x2="300" y2="260"/>
    <line x1="140" y1="260" x2="260" y2="260"/>
  </g>
  <!-- Vertical window lines (front face) -->
  <g stroke="#4a9eff" stroke-width="0.3" opacity="0.4">
    <line x1="160" y1="60" x2="160" y2="280"/>
    <line x1="180" y1="60" x2="180" y2="280"/>
    <line x1="200" y1="50" x2="200" y2="280"/>
    <line x1="220" y1="60" x2="220" y2="280"/>
    <line x1="240" y1="60" x2="240" y2="280"/>
  </g>
  <!-- Vertical lines (left face) -->
  <g stroke="#3b82f6" stroke-width="0.3" opacity="0.35">
    <line x1="110" y1="80" x2="110" y2="280"/>
    <line x1="120" y1="75" x2="120" y2="280"/>
    <line x1="130" y1="70" x2="130" y2="280"/>
  </g>
  <!-- Vertical lines (right face) -->
  <g stroke="#60a5fa" stroke-width="0.3" opacity="0.3">
    <line x1="270" y1="60" x2="270" y2="280"/>
    <line x1="280" y1="65" x2="280" y2="280"/>
    <line x1="290" y1="70" x2="290" y2="280"/>
  </g>
  <!-- Spire -->
  <line x1="200" y1="20" x2="200" y2="5" stroke="#60a5fa" stroke-width="1"/>
  <circle cx="200" cy="5" r="2" fill="#60a5fa" opacity="0.8"/>
  <!-- Ground grid -->
  <g stroke="#2563eb" stroke-width="0.3" opacity="0.2">
    <line x1="50" y1="280" x2="350" y2="280"/>
    <line x1="80" y1="290" x2="320" y2="290"/>
    <line x1="110" y1="300" x2="290" y2="300"/>
    <line x1="140" y1="310" x2="260" y2="310"/>
    <line x1="200" y1="280" x2="200" y2="320"/>
    <line x1="150" y1="280" x2="130" y2="320"/>
    <line x1="250" y1="280" x2="270" y2="320"/>
  </g>
</svg>
